# See https://github.com/testrift/testrift-server/blob/main/docs/server_config.md for more details.
server:
  port: 8080
  localhost_only: true

ai_analysis:
  enabled: true
  openai_api_key: ${env:OPENAI_API_KEY}
  trigger: auto
  effort: normal
  max_failures_per_run: 20
  model_tier1: gpt-4.1-mini
  model_tier2: gpt-4.1
  monthly_budget_usd: 10.0