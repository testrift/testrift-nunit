# Integration test configuration
autoStartServer:
  enabled: true
  serverYaml: TestRiftServer.yaml

serverUrl: http://localhost:19999

runName: Integration Test Run

target: integration-target
purpose: manual
sources:
  test-system:
    branch: main
    revision: integration-revision

metadata:
  - name: Test Type
    value: Integration
  - name: Framework
    value: NUnit 3.x
